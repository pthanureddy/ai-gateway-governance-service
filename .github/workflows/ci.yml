name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: gateway_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U gateway -d gateway_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://gateway:synthetic-ci-only@localhost:5432/gateway_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: ruff format --check . && ruff check .
      - run: pytest --cov=ai_gateway --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - run: python -m build
      - run: docker build -t ai-gateway:ci .
      - name: Smoke test packaged service
        run: |
          docker run -d --name gateway -p 18080:8080 -e 'GATEWAY_KEYS_JSON={"local-ci-credential-only":"design"}' ai-gateway:ci
          trap 'docker logs gateway; docker rm -f gateway' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:18080/health/ready && break
            sleep 1
          done
          curl --fail --silent http://localhost:18080/v1/answers -H 'Authorization: Bearer local-ci-credential-only' -H 'Content-Type: application/json' -d '{"question":"materials design review"}' | python -c 'import sys,json; r=json.load(sys.stdin); assert r["citations"] == ["materials-policy"]'
  terraform-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.10.4'
      - run: terraform fmt -check -recursive
        working-directory: infra/azure
      - run: terraform init -backend=false
        working-directory: infra/azure
      - run: terraform validate && terraform test
        working-directory: infra/azure
