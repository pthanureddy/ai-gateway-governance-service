[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-gateway-governance-service"
version = "0.1.0"
description = "Policy-gated AI retrieval gateway with budget reservations and tenant-isolated caches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.9,<3", "sqlalchemy>=2.0,<3", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<8", "ruff>=0.12,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
